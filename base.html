<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>达理学堂 · 讲师直播中控台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',sans-serif;background:#F7F8FC;color:#1F2937;display:flex;min-height:100vh}
  a{text-decoration:none;color:inherit}

  /* ===== SIDEBAR ===== */
  .sidebar{width:230px;background:#fff;border-right:1px solid #EEF0F5;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
  .sidebar-logo{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #EEF0F5}
  .sidebar-logo .logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
  .sidebar-logo .logo-text{font-size:16px;font-weight:700;color:#1F2937}
  .sidebar-logo .logo-sub{font-size:10px;color:#9CA3AF;margin-top:1px}
  .sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
  .nav-section{padding:8px 20px 4px;font-size:10px;color:#B0B7C3;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13px;color:#6B7280;transition:all .15s;border-left:3px solid transparent}
  .sidebar-item:hover{background:#F8F9FE;color:#4F46E5}
  .sidebar-item.active{background:#EEF0FF;color:#4F46E5;font-weight:600;border-left-color:#4F46E5}
  .sidebar-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
  .sidebar-footer{padding:14px 20px;border-top:1px solid #EEF0F5;display:flex;align-items:center;gap:10px}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
  .user-info .user-name{font-size:13px;font-weight:600;color:#1F2937}
  .user-info .user-role{font-size:10px;color:#9CA3AF}

  /* ===== MAIN ===== */
  .main{margin-left:230px;flex:1;padding:24px 28px;min-height:100vh}

  /* ===== PAGE SYSTEM ===== */
  .page{display:none}
  .page.active{display:block}

  /* ===== COMPONENTS ===== */
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
  .page-header h1{font-size:22px;font-weight:700;color:#1F2937}
  .page-header p{font-size:13px;color:#9CA3AF;margin-top:3px}
  .page-actions{display:flex;gap:8px;align-items:center}

  .btn{padding:8px 16px;border-radius:8px;border:1px solid #E5E7EB;background:#fff;font-size:13px;font-weight:500;color:#374151;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn:hover{border-color:#C7D2FE;color:#4F46E5}
  .btn.primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none}
  .btn.primary:hover{opacity:.9}
  .btn.danger{background:#FEE2E2;color:#DC2626;border-color:#FECACA}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn.live{background:#EF4444;color:#fff;border:none;animation:pulse-live 2s infinite}
  @keyframes pulse-live{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .stat-row.col5{grid-template-columns:repeat(5,1fr)}
  .stat-row.col3{grid-template-columns:repeat(3,1fr)}
  .stat-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #EEF0F5}
  .stat-label{font-size:12px;color:#9CA3AF;margin-bottom:6px}
  .stat-value{font-size:24px;font-weight:700;color:#1F2937}
  .stat-change{font-size:11px;margin-top:4px;font-weight:500}
  .stat-change.up{color:#10B981}
  .stat-change.down{color:#EF4444}
  .stat-change.warn{color:#F59E0B}
  .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .stat-icon.purple{background:#EEF0FF;color:#6366F1}
  .stat-icon.green{background:#ECFDF5;color:#10B981}
  .stat-icon.blue{background:#EFF6FF;color:#3B82F6}
  .stat-icon.orange{background:#FFF7ED;color:#F59E0B}
  .stat-icon.red{background:#FEF2F2;color:#EF4444}
  .stat-icon.cyan{background:#ECFEFF;color:#06B6D4}

  .card{background:#fff;border-radius:12px;border:1px solid #EEF0F5;margin-bottom:18px;overflow:hidden}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #F3F4F6}
  .card-title{font-size:14px;font-weight:600;color:#1F2937}
  .card-body{padding:18px}

  .data-table{width:100%;border-collapse:collapse;font-size:13px}
  .data-table th{text-align:left;padding:10px 14px;font-weight:600;color:#6B7280;font-size:12px;background:#FAFBFC;border-bottom:1px solid #EEF0F5}
  .data-table td{padding:10px 14px;border-bottom:1px solid #F3F4F6;color:#374151;vertical-align:middle}
  .data-table tr:hover td{background:#FAFBFC}
  .data-table tr:last-child td{border-bottom:none}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;margin-right:4px}
  .pill.green{background:#ECFDF5;color:#059669}
  .pill.red{background:#FEF2F2;color:#DC2626}
  .pill.blue{background:#EFF6FF;color:#2563EB}
  .pill.orange{background:#FFF7ED;color:#D97706}
  .pill.purple{background:#F5F3FF;color:#7C3AED}
  .pill.gray{background:#F3F4F6;color:#6B7280}
  .pill.pink{background:#FDF2F8;color:#DB2777}
  .pill.cyan{background:#ECFEFF;color:#0891B2}
  .pill.live{background:#EF4444;color:#fff;animation:pulse-pill 2s infinite}
  @keyframes pulse-pill{0%,100%{opacity:1}50%{opacity:.7}}

  .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .filter-tag{padding:5px 14px;border-radius:20px;font-size:12px;color:#6B7280;background:#fff;border:1px solid #E5E7EB;cursor:pointer;transition:all .15s}
  .filter-tag.active{background:#EEF0FF;color:#4F46E5;border-color:#C7D2FE;font-weight:500}
  .filter-select{padding:6px 12px;border-radius:8px;border:1px solid #E5E7EB;font-size:12px;font-family:inherit;color:#374151;background:#fff;cursor:pointer}

  .mini-avatar{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;vertical-align:middle}

  .row{display:grid;gap:18px;margin-bottom:18px}
  .row-6-4{grid-template-columns:6fr 4fr}
  .row-7-3{grid-template-columns:7fr 3fr}
  .row-5-5{grid-template-columns:1fr 1fr}

  .toggle{position:relative;width:40px;height:22px;background:#D1D5DB;border-radius:11px;cursor:pointer;transition:.2s}
  .toggle.on{background:#6366F1}
  .toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .toggle.on::after{left:20px}

  .progress-bar{height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;border-radius:3px;transition:width .3s}

  .live-indicator{display:inline-flex;align-items:center;gap:6px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#EF4444;animation:pulse-dot 1.5s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

  .chat-msg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6}
  .chat-msg:last-child{border-bottom:none}
  .chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
  .chat-name{font-size:12px;font-weight:600;color:#374151}
  .chat-text{font-size:13px;color:#4B5563;margin-top:2px;line-height:1.5}
  .chat-time{font-size:10px;color:#B0B7C3;margin-top:2px}

  .wb-toolbar{display:flex;align-items:center;gap:6px;padding:10px 16px;background:#FAFBFC;border-bottom:1px solid #EEF0F5;border-radius:12px 12px 0 0}
  .wb-tool{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6B7280;transition:.15s;border:1px solid transparent}
  .wb-tool:hover{background:#EEF0FF;color:#4F46E5}
  .wb-tool.active{background:#EEF0FF;color:#4F46E5;border-color:#C7D2FE}
  .wb-canvas{background:#fff;border:1px solid #EEF0F5;border-top:none;border-radius:0 0 12px 12px;min-height:400px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

  .input-field{padding:8px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:inherit;width:100%;transition:border-color .15s}
  .input-field:focus{outline:none;border-color:#6366F1}
  .input-group{margin-bottom:14px}
  .input-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block}

  .code-block{background:#1F2937;color:#E5E7EB;padding:14px 18px;border-radius:10px;font-family:'Courier New',monospace;font-size:12px;line-height:1.6;overflow-x:auto;margin:10px 0}
  .code-block .key{color:#818CF8}
  .code-block .val{color:#34D399}
  .code-block .comment{color:#6B7280}

  .tab-bar{display:flex;gap:0;border-bottom:2px solid #EEF0F5;margin-bottom:18px}
  .tab-item{padding:10px 20px;font-size:13px;color:#6B7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;font-weight:500}
  .tab-item.active{color:#4F46E5;border-bottom-color:#4F46E5}
  .tab-item:hover{color:#4F46E5}
</style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">达</div>
    <div>
      <div class="logo-text">达理学堂</div>
      <div class="logo-sub">讲师直播中控台</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">概览</div>
    <div class="sidebar-item active" onclick="switchPage('workspace',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>工作台</span>
    </div>

    <div class="nav-section">直播管理</div>
    <div class="sidebar-item" onclick="switchPage('live',this)">
      <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      <span>直播管理</span>
    </div>
    <div class="sidebar-item" onclick="switchPage('push-config',this)">
      <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      <span>推流配置</span>
    </div>
    <div class="sidebar-item" onclick="switchPage('whiteboard',this)">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>互动白板</span>
    </div>

    <div class="nav-section">互动与数据</div>
    <div class="sidebar-item" onclick="switchPage('chat',this)">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>聊天互动</span>
    </div>
    <div class="sidebar-item" onclick="switchPage('stats',this)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>数据统计</span>
    </div>

    <div class="nav-section">运营</div>
    <div class="sidebar-item" onclick="switchPage('recording',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      <span>录制回放</span>
    </div>
    <div class="sidebar-item" onclick="switchPage('instructor',this)">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>讲师管理</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="user-avatar">义</div>
    <div class="user-info">
      <div class="user-name">义飞Blake</div>
      <div class="user-role">超级管理员</div>
    </div>
  </div>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main">

<!-- PAGE_PLACEHOLDER -->

</div><!-- end main -->

<!-- ===== CHART.JS ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Page navigation
function switchPage(pageId, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  el.classList.add('active');
  if (pageId === 'stats') initStatsCharts();
}

// Dynamic date
function initDates() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const date = now.getDate();
  const dayOfWeek = now.getDay();
  const hour = now.getHours();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const greet = hour < 6 ? '凌晨好' : hour < 9 ? '早上好' : hour < 12 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  const el1 = document.getElementById('greeting-text');
  if (el1) el1.textContent = greet + '，义飞Blake';
  const el2 = document.getElementById('today-date');
  if (el2) el2.textContent = year + '年' + (month+1) + '月' + date + '日 ' + weekdays[dayOfWeek];
  // Chart labels
  const chartLabels = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    chartLabels.push((d.getMonth()+1) + '/' + d.getDate());
  }
  window._chartLabels = chartLabels;
}

// Stats charts
let statsChartInit = false;
function initStatsCharts() {
  if (statsChartInit) return;
  statsChartInit = true;
  // Viewers trend
  const ctx1 = document.getElementById('viewersChart');
  if (ctx1) {
    const g1 = ctx1.getContext('2d');
    const bg1 = g1.createLinearGradient(0, 0, 0, 200);
    bg1.addColorStop(0, 'rgba(99,102,241,.15)');
    bg1.addColorStop(1, 'rgba(99,102,241,.01)');
    new Chart(ctx1, {
      type: 'line',
      data: {
        labels: window._chartLabels || ['5/23','5/24','5/25','5/26','5/27','5/28','5/29'],
        datasets: [{
          label: '观看人次', data: [3200, 4100, 3800, 5200, 4600, 5800, 5200],
          borderColor: '#6366F1', backgroundColor: bg1, borderWidth: 2.5, fill: true, tension: 0.4,
          pointBackgroundColor: '#6366F1', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 4
        },{
          label: '峰值在线', data: [820, 1100, 950, 1400, 1200, 1500, 1350],
          borderColor: '#10B981', backgroundColor: 'transparent', borderWidth: 2, borderDash: [5,3], fill: false, tension: 0.4,
          pointBackgroundColor: '#10B981', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 12, boxHeight: 3, font: { size: 11, family: "'Noto Sans SC'" }, color: '#9CA3AF', padding: 16 } },
          tooltip: { backgroundColor: '#1F2937', titleFont: { family: "'Noto Sans SC'", size: 12 }, bodyFont: { family: "'Noto Sans SC'", size: 12 }, padding: 10, cornerRadius: 8 }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9CA3AF' }, border: { display: false } },
          y: { grid: { color: '#F0F1F5' }, ticks: { font: { size: 11 }, color: '#9CA3AF' }, border: { display: false } }
        },
        interaction: { intersect: false, mode: 'index' }
      }
    });
  }
  // Revenue chart
  const ctx2 = document.getElementById('revenueChart');
  if (ctx2) {
    const g2 = ctx2.getContext('2d');
    const bg2 = g2.createLinearGradient(0, 0, 0, 200);
    bg2.addColorStop(0, 'rgba(245,158,11,.2)');
    bg2.addColorStop(1, 'rgba(245,158,11,.01)');
    new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: window._chartLabels || ['5/23','5/24','5/25','5/26','5/27','5/28','5/29'],
        datasets: [{
          label: '打赏收入(元)', data: [2800, 3500, 3200, 4800, 4100, 5200, 4600],
          backgroundColor: bg2, borderColor: '#F59E0B', borderWidth: 1.5, borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 12, boxHeight: 3, font: { size: 11, family: "'Noto Sans SC'" }, color: '#9CA3AF', padding: 16 } },
          tooltip: { backgroundColor: '#1F2937', titleFont: { family: "'Noto Sans SC'", size: 12 }, bodyFont: { family: "'Noto Sans SC'", size: 12 }, padding: 10, cornerRadius: 8 }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#9CA3AF' }, border: { display: false } },
          y: { grid: { color: '#F0F1F5' }, ticks: { font: { size: 11 }, color: '#9CA3AF', callback: function(v) { return v >= 10000 ? (v/10000)+'万' : v; } }, border: { display: false } }
        }
      }
    });
  }
}

initDates();
</script>
</body>
</html>
